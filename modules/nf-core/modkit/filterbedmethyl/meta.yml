name: modkit_filterbedmethyl
description: |
  Drop rows from a modkit bedMethyl file whose valid_coverage (column 10)
  exceeds a threshold (default 65534). Works around a u16 overflow bug in
  modkit's bedMethyl writer where valid_coverage saturates at 65535 while
  count_modified and count_canonical use wider integer types, causing
  downstream `modkit dmr pair` to abort with a "valid coverage is not equal
  to the sum of canonical and modified counts" error. The offending sites
  are structural (collapsed repeat loci, rDNA, mitochondrial sequence at
  very deep yield) and are typically a few tens of rows out of tens of
  millions. The output is a bgzipped, tabix-indexed bedMethyl file that can
  be fed directly into `modkit dmr pair`.
keywords:
  - modkit
  - bedmethyl
  - methylation
  - filter
  - nanopore
  - ont
  - bgzip
  - tabix
tools:
  - htslib:
      description: |
        C library for high-throughput sequencing data formats. Provides
        bgzip (block compression) and tabix (indexing for tab-delimited
        genome position files).
      homepage: https://www.htslib.org
      documentation: https://www.htslib.org/doc/
      tool_dev_url: https://github.com/samtools/htslib
      doi: 10.1093/gigascience/giab007
      licence:
        - "MIT"
      identifier: biotools:htslib
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - bedmethyl_gz:
        type: file
        description: bgzipped modkit bedMethyl file
        pattern: "*.{bed.gz,bedmethyl.gz}"
        ontologies:
          - edam: http://edamontology.org/format_3003
          - edam: http://edamontology.org/format_3989
    - tbi:
        type: file
        description: tabix index for the bedMethyl file
        pattern: "*.tbi"
        ontologies: []
output:
  bedmethyl:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.filtered.bed.gz":
          type: file
          description: |
            Filtered, bgzipped bedMethyl with rows above the valid_coverage
            threshold removed.
          pattern: "*.filtered.bed.gz"
          ontologies:
            - edam: http://edamontology.org/format_3003
            - edam: http://edamontology.org/format_3989
      - "*.filtered.bed.gz.tbi":
          type: file
          description: tabix index for the filtered bedMethyl
          pattern: "*.filtered.bed.gz.tbi"
          ontologies: []
  versions_bgzip:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - bgzip:
          type: string
          description: The tool name
      - bgzip --version | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool
  versions_tabix:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - tabix:
          type: string
          description: The tool name
      - tabix --version | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - bgzip:
          type: string
          description: The tool name
      - bgzip --version | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - tabix:
          type: string
          description: The tool name
      - tabix --version | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool
